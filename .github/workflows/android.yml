name: Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Prepare installable APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AutoVue.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AutoVue-apk
          path: AutoVue.apk
          if-no-files-found: error

      - name: Publish rolling GitHub release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: autovue-latest
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" AutoVue.apk --clobber
            gh release edit "$TAG"               --title "AutoVue Latest Test Build"               --notes "Latest installable AutoVue APK built from main. Android 16 target with phone media/browser features and supported Android Auto Media3 audio integration."
          else
            gh release create "$TAG" AutoVue.apk               --target "$GITHUB_SHA"               --title "AutoVue Latest Test Build"               --notes "Latest installable AutoVue APK built from main. Android 16 target with phone media/browser features and supported Android Auto Media3 audio integration."
          fi
